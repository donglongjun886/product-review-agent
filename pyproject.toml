[project]
name = "product-review-agent"
version = "0.1.0"
description = "电商平台商品内容治理 · 复杂风险调查 Agent（LangGraph 编排的多步调查式机审系统，决策输出 PASS / REJECT / HUMAN_REVIEW）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "litellm",
    "sqlalchemy[asyncio]",
    "aiomysql",
    "alembic",
    "redis",
]

[project.optional-dependencies]
rag = ["qdrant-client"]
observability = ["langfuse", "opentelemetry-sdk", "opentelemetry-instrumentation-fastapi"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg"]

[project]
name = "product-review-agent"
version = "0.1.0"
description = "电商平台商品内容治理 · 复杂风险调查 Agent（LangGraph 编排的多步调查式机审系统，决策输出 PASS / REJECT / HUMAN_REVIEW）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "litellm",
    "sqlalchemy[asyncio]",
    "aiomysql",
    "alembic",
    "redis",
]

[project.optional-dependencies]
rag = ["qdrant-client", "fastembed"]
# 可观测性（docs/09）：只需 Langfuse Python SDK（v4，内部已带 OTel 依赖）。
# **不引入 OTel 自动埋点/collector** —— 本项目只做"最小可演示观测闭环"，不铺 OTel 全家桶。
observability = ["langfuse>=4.15,<5"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
